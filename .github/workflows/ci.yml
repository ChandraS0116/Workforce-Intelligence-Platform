name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workforce-backend
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8
        
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Test with pytest
      run: |
        # Skip actual tests if tests folder doesn't exist yet, but ensure syntax is valid
        python -m compileall .
        
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workforce-frontend
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: "20.x"
        cache: 'npm'
        cache-dependency-path: './workforce-frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npm run typecheck --if-present || echo "No typecheck script, skipping"
      
    - name: Build
      run: npm run build
      
    - name: Archive build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-dist
        path: ./workforce-frontend/dist/
